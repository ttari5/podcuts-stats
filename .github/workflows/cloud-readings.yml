name: Cloud readings
# Reads YouTube and Instagram views while the PodCuts PC is off
# (cloud_refresh.py). Secrets: YT_API_KEY, IG_TOKEN_<BRAND> - each named here.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Read even though the PC is on (a test)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: cloud-readings
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read views
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IG_TOKEN_PODCUTS: ${{ secrets.IG_TOKEN_PODCUTS }}
          IG_TOKEN_CHESS_CLIPS: ${{ secrets.IG_TOKEN_CHESS_CLIPS }}
          IG_TOKEN_ANIMAL_REACTS: ${{ secrets.IG_TOKEN_ANIMAL_REACTS }}
          IG_TOKEN_MOVIE_CLIPS: ${{ secrets.IG_TOKEN_MOVIE_CLIPS }}
          CLOUD_FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 cloud_refresh.py data.json
      - name: Save
        run: |
          if git diff --quiet data.json; then echo "nothing new"; exit 0; fi
          git config user.name "PodCuts stats"
          git config user.email "podcuts-stats@users.noreply.github.com"
          git commit -am "Cloud reading"
          git push || (git pull --rebase && git push) || echo "the PC pushed meanwhile - next hour"
